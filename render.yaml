# Render Blueprint -- deploys the full stack in one shot.
#
# In the Render dashboard: New > Blueprint > select this repo/branch.
# Render reads this file and provisions everything below together.
#
# IMPORTANT before you rely on this for real sales:
#   - `plan: free` is used everywhere below, by deliberate choice, to try
#     this out at zero cost first. Two real limits come with that:
#       * Render deletes a free Postgres database 30 days after creation
#         -- all your products/sales/customers with it, no warning beyond
#         Render's own dashboard notice. Export your data before day 30,
#         or upgrade pos-db's plan in the Render dashboard before then.
#       * Free web services (pos-backend) spin down after 15 minutes of
#         no traffic -- the first request after a quiet spell can take
#         30-60s to wake back up (a customer waiting at the till will
#         notice). Upgrade pos-backend's plan when that's not acceptable.
#     Neither limit blocks trying the whole system for real first -- just
#     don't build a business on the free tier long-term without upgrading.
#   - Render's free workspace plan does not support background worker
#     services at all (confirmed live: "service type is not available for
#     this plan"), so there is deliberately no pos-celery-worker service
#     below. Instead, POS_CELERY_TASK_ALWAYS_EAGER=true makes pos-backend
#     run receipt SMS and print-job dispatch synchronously, in-process,
#     right when a sale is posted -- rather than handing them to a worker
#     that doesn't exist. They still run correctly, just add a little
#     latency to that one request instead of being decoupled from it (see
#     Settings.celery_task_always_eager in app/core/config.py for exactly
#     what that trades off). Once your Render workspace is on a paid plan
#     and you add a real pos-celery-worker service back (copy the
#     pos-backend block, `type: worker`, drop `healthCheckPath`, add
#     `dockerCommand: celery -A app.celery_app:celery_app worker
#     --loglevel=info` and `SKIP_MIGRATIONS: "true"`), remove
#     POS_CELERY_TASK_ALWAYS_EAGER from pos-backend to go back to true
#     background dispatch.
#   - Every *_KEY / *_SECRET below is a safe mock/test default (same ones
#     used in local dev). UPI QR payments, SMS receipts, and GST e-filing
#     will not actually reach Razorpay/MSG91/a real GSP until you replace
#     them with real credentials as Render environment variable overrides
#     -- cash/card billing, inventory, GST calculation, and reporting all
#     work correctly with no external credentials at all.
#   - sync_agent (the offline-terminal client) is NOT deployed here -- it
#     runs on the till's own machine, not on a server. See
#     backend/sync_agent/README-equivalent docs in ARCHITECTURE.md #5.

databases:
  - name: pos-db
    databaseName: pos
    user: pos
    plan: free

services:
  - type: keyvalue
    name: pos-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  - type: web
    name: pos-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: POS_DATABASE_URL
        fromDatabase:
          name: pos-db
          property: connectionString
      - key: POS_REDIS_URL
        fromService:
          type: keyvalue
          name: pos-redis
          property: connectionString
      - key: POS_SECRET_KEY
        generateValue: true
      # No Celery worker on this plan (see the top-of-file note) -- run
      # background tasks synchronously in-process instead of queuing them
      # to nowhere.
      - key: POS_CELERY_TASK_ALWAYS_EAGER
        value: "true"
      # UPI QR payments (Razorpay) -- test-mode defaults, safe to ship.
      # Replace with real rzp_live_... values in the Render dashboard once
      # you have a Razorpay account. See ARCHITECTURE.md #9.
      - key: POS_RAZORPAY_KEY_ID
        value: rzp_test_0000000000000
      - key: POS_RAZORPAY_KEY_SECRET
        value: test_secret_change_me
      - key: POS_RAZORPAY_WEBHOOK_SECRET
        value: test_webhook_secret_change_me
      # SMS receipts (MSG91) -- blank keeps notifications on the safe
      # logging adapter (no SMS actually sent, nothing breaks).
      - key: POS_MSG91_AUTH_KEY
        value: ""
      - key: POS_MSG91_SENDER_ID
        value: POSAPP
      - key: POS_MSG91_FLOW_ID
        value: ""
      # Thermal printer -- irrelevant on a server; each till prints to its
      # own local network printer, configured on that till, not here.
      - key: POS_PRINTER_HOST
        value: 192.168.1.100
      - key: POS_PRINTER_PORT
        value: "9100"
      - key: POS_PRINTER_ENABLED
        value: "false"
      # GST e-filing -- "mock" by default (see ARCHITECTURE.md #9).
      - key: POS_GSP_PROVIDER
        value: mock
      - key: POS_GSP_BASE_URL
        value: https://sandbox.example-gsp.invalid
      - key: POS_GSP_API_KEY
        value: mock-gsp-api-key

  - type: web
    name: pos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # The frontend and backend are two independent Render services (no
      # shared reverse proxy between them, unlike local docker-compose's
      # nginx), so every API call needs the backend's real host baked in
      # at build time -- see frontend/src/api/client.ts. Render's "host"
      # property resolves to the private-network hostname slug (not a
      # publicly resolvable domain by itself); client.ts appends
      # .onrender.com to turn it into the real public hostname the
      # browser can actually reach.
      - key: VITE_API_HOST
        fromService:
          type: web
          name: pos-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
